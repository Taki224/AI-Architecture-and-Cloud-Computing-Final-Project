name: Test and Deploy Heavy Model

on:
  push:
    branches: [ "**" ]  # Runs on pushes to ANY branch
  pull_request:
    branches: [ "**" ]  # Optional: Also runs on all Pull Requests

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: project-bf5303f9-c6e6-4630-a08
  REGION: europe-north1
  SERVICE_NAME: heavy-model-service
  REPOSITORY: carbon-aware

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r tests/test_requirements.txt
          
      - name: Run Unit Tests
        run: |
          # Ensuring all model and service paths are included for pytest
          export PYTHONPATH=$PYTHONPATH:$(pwd)/models:$(pwd)/services/heavy-model
          pytest tests/unit/

  deploy:
    needs: test
    # This condition ensures the deploy job ONLY runs on the main branch
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: 'project-bf5303f9-c6e6-4630-a08'
          workload_identity_provider: 'projects/48248613136/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-actions-sa@project-bf5303f9-c6e6-4630-a08.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authorize Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build and Push Container
        run: |
          IMAGE_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/heavy-model:${{ github.sha }}"
          docker build -f deployment/docker/Dockerfile.heavy -t $IMAGE_TAG .
          docker push $IMAGE_TAG
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE_TAG }}
          flags: |
            --service-account=heavy-model-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com
            --set-env-vars=GOOGLE_CLOUD_PROJECT=${{ env.PROJECT_ID }}
            --set-env-vars=PUBSUB_SENSOR_TOPIC=sensor-data
            --set-env-vars=PUBSUB_SENSOR_SUBSCRIPTION=sensor-data-sub
            --set-env-vars=PUBSUB_ANOMALY_TOPIC=anomaly-results
            --memory=2Gi
            --cpu=2
            --min-instances=1
            --max-instances=1
            --concurrency=1
            --timeout=300