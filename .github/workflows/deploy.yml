name: Test and Deploy Heavy Model

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  id-token: write # Required for Workload Identity Federation

env:
  PROJECT_ID: your-project-id
  REGION: europe-north1
  SERVICE_NAME: heavy-model-service
  REPOSITORY: carbon-aware

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r tests/test_requirements.txt
          
      - name: Run Unit Tests
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/models:$(pwd)/services/heavy-model
          pytest tests/unit/
        # Matches project test structure

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/PROJECT_NUMBER/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-actions-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authorize Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build and Push Container
        run: |
          IMAGE_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/heavy-model:${{ github.sha }}"
          docker build -f deployment/docker/Dockerfile.heavy -t $IMAGE_TAG .
          docker push $IMAGE_TAG
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE_TAG }}
          flags: |
            --service-account=heavy-model-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com
            --set-env-vars=GOOGLE_CLOUD_PROJECT=${{ env.PROJECT_ID }}
            --set-env-vars=PUBSUB_SENSOR_TOPIC=sensor-data
            --set-env-vars=PUBSUB_SENSOR_SUBSCRIPTION=sensor-data-sub
            --set-env-vars=PUBSUB_ANOMALY_TOPIC=anomaly-results
            --memory=512Mi
            --cpu=1